name: Test

on: 
  push:
    branches: [main]
    paths: 
      - "book/**"

  pull_request:
    branches: [main]
    paths:
      - "book/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: book

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build
      - run: npm test
